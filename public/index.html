<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DMARC / MTA-STS Analyzer</title>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-mark">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect x="1" y="1" width="26" height="26" rx="3" stroke="var(--accent)" stroke-width="1.5"/>
            <path d="M7 14 L14 7 L21 14 L14 21 Z" stroke="var(--accent)" stroke-width="1.5" fill="none"/>
            <circle cx="14" cy="14" r="2" fill="var(--accent)"/>
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-sub">Report Analyzer</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item active" data-view="dashboard" onclick="navigate('dashboard')">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="1" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.3"/></svg>
          Dashboard
        </a>
        <a class="nav-item" data-view="dmarc" onclick="navigate('dmarc')">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1 L14 4 L14 8 C14 11.5 11 14.5 8 15 C5 14.5 2 11.5 2 8 L2 4 Z" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M5 8 L7 10 L11 6" stroke="currentColor" stroke-width="1.3"/></svg>
          DMARC Reports
        </a>
        <a class="nav-item" data-view="mtasts" onclick="navigate('mtasts')">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="5" width="12" height="9" rx="1" stroke="currentColor" stroke-width="1.3"/><path d="M5 5 L5 3.5 C5 2.12 6.12 1 7.5 1 L8.5 1 C9.88 1 11 2.12 11 3.5 L11 5" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="9.5" r="1" fill="currentColor"/></svg>
          MTA-STS Reports
        </a>
      </nav>

      <div class="sidebar-upload">
        <div class="upload-zone" id="uploadZone">
          <input type="file" id="fileInput" accept=".xml,.zip,.gz,.json,.gzip" multiple hidden />
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 15 L12 3 M8 7 L12 3 L16 7" stroke="currentColor" stroke-width="1.5"/><path d="M3 17 L3 19 C3 20.1 3.9 21 5 21 L19 21 C20.1 21 21 20.1 21 19 L21 17" stroke="currentColor" stroke-width="1.5"/></svg>
          <span class="upload-label">Drop reports here</span>
          <span class="upload-hint">XML · ZIP · GZ · JSON</span>
          <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Browse Files</button>
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="danger-btn" onclick="clearAll()">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 4 L12 4 M5 4 L5 2 L9 2 L9 4 M3 4 L3 12 C3 12.55 3.45 13 4 13 L10 13 C10.55 13 11 12.55 11 12 L11 4" stroke="currentColor" stroke-width="1.2"/></svg>
          Clear All Reports
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <!-- Upload progress bar -->
      <div class="upload-progress" id="uploadProgress" style="display:none">
        <div class="progress-bar" id="progressBar"></div>
        <span id="progressLabel">Uploading…</span>
      </div>

      <!-- Toast -->
      <div class="toast" id="toast"></div>

      <!-- Views -->
      <div id="view-dashboard" class="view active">
        <div class="view-header">
          <h1>Dashboard</h1>
          <span class="view-sub">Email authentication overview</span>
        </div>

        <div class="stats-grid" id="statsGrid">
          <!-- filled by JS -->
        </div>

        <div class="section-title">Recent Reports</div>
        <div class="report-list" id="recentList">
          <!-- filled by JS -->
        </div>
      </div>

      <div id="view-dmarc" class="view">
        <div class="view-header">
          <h1>DMARC Reports</h1>
          <span class="view-sub">RFC 7489 aggregate reports</span>
        </div>
        <div class="report-list" id="dmarcList"></div>
      </div>

      <div id="view-mtasts" class="view">
        <div class="view-header">
          <h1>MTA-STS Reports</h1>
          <span class="view-sub">RFC 8460 TLS reports</span>
        </div>
        <div class="report-list" id="mtaStsList"></div>
      </div>

      <!-- Detail panel (slides in) -->
      <div class="detail-panel" id="detailPanel">
        <div class="detail-header">
          <button class="back-btn" onclick="closeDetail()">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3 L5 8 L10 13" stroke="currentColor" stroke-width="1.5"/></svg>
            Back
          </button>
          <h2 id="detailTitle">Report Detail</h2>
          <button class="icon-btn danger" id="detailDeleteBtn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 4 L12 4 M5 4 L5 2 L9 2 L9 4 M3 4 L3 12 C3 12.55 3.45 13 4 13 L10 13 C10.55 13 11 12.55 11 12 L11 4" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
        </div>
        <div class="detail-body" id="detailBody"></div>
      </div>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
